# Alonecraft overrides for mod_ahbot (mod-ah-bot-plus)
#
# Only keys where Alonecraft deliberately differs from modules/mod-ah-bot-plus/conf/mod_ahbot.conf.dist belong here --
# every other key comes from that template, so new upstream settings arrive
# automatically instead of silently falling back to compiled-in defaults.
#
# Apply with:  python tools/sync_configs.py --write --accept-changes
# Check drift: python tools/sync_configs.py
#
# Why this module exists for Alonecraft: solo play has no player economy. The
# auction house is permanently empty, so loot is vendor-trash and nothing you
# need is ever for sale. The seller bot supplies the shelves; the buyer bot
# supplies the demand. Both halves are needed for the AH to mean anything alone.
#
# Money is fiat in both directions -- gold spent on a bot listing is discarded
# (a sink), gold the buyer bot pays you is conjured (a faucet). That is accepted
# deliberately; see AcceptablePriceModifier below if inflation runs hot.
#
# Listing proportions and price multipliers are left at the module's blizzlike
# defaults, which means epics do appear on the AH.

# The seller. Posts listings owned by the GUIDs below.
AuctionHouseBot.EnableSeller = true

# Character "Auctioneer" (account 205 / AHBOT). Deliberately NOT a playerbot
# character -- AiPlayerbot.RandomBotAccountPrefix is "rndbot", so this account is
# never claimed by the random bot pool. The module's own docs warn that using a
# playerbot GUID here "will likely crash the server".
# This name is player-visible on every listing, in all three auction houses.
AuctionHouseBot.GUIDs = 2013

# The buyer. This is what turns your loot into gold with no other players
# around, and is the half of the module that matters most for solo play.
AuctionHouseBot.Buyer.Enabled = true

# --- Pricing -----------------------------------------------------------------
#
# Out of the box, buyout is just (vendor SellPrice x quality multipliers), and
# item level contributes nothing because the ItemLevel multipliers ship at 0
# (= disabled). Measured against a freshly populated AH, that produced a flat
# ratio for every item in the game: uncommon 2.67x vendor, rare 4.97x, epic
# 6.80x -- matching 1.8x1.2, 1.9x2.5 and 2.1x3.0 exactly. The practical effect
# was ilvl 264 ICC trash BoEs (Boots of Kingly Upheaval, Hellfrozen
# Bonegrinders) listing at 80-90 gold, because an ilvl 264 epic and a level-20
# green were priced by the same rule.
#
# Real 3.3.5a ratios climb steeply with desirability rather than staying flat:
# levelling green ~15x vendor, level 80 blue ~50x, ilvl 200-226 epic ~250x,
# ilvl 264 BoE ~1000x. The item level term below restores the within-tier
# spread so a 264 is not priced like a 130; because it multiplies everything,
# the lower tiers are compensated back down or greens would jump to ~50g.
#
# Target ratios: green ~2.3x vendor (unchanged), blue ~27x, ilvl 130 epic
# ~1,200g, ilvl 264 epic ~13,000g.
AuctionHouseBot.PriceMultiplier.ItemLevel.Category.Armor  = 0.05
AuctionHouseBot.PriceMultiplier.ItemLevel.Category.Weapon = 0.05

AuctionHouseBot.PriceMultiplier.CategoryArmor.QualityNormal   = 0.5
AuctionHouseBot.PriceMultiplier.CategoryArmor.QualityUncommon = 0.35
AuctionHouseBot.PriceMultiplier.CategoryArmor.QualityRare     = 4.0
AuctionHouseBot.PriceMultiplier.CategoryArmor.QualityEpic     = 36

AuctionHouseBot.PriceMultiplier.CategoryWeapon.QualityNormal   = 0.5
AuctionHouseBot.PriceMultiplier.CategoryWeapon.QualityUncommon = 0.35
AuctionHouseBot.PriceMultiplier.CategoryWeapon.QualityRare     = 4.0
AuctionHouseBot.PriceMultiplier.CategoryWeapon.QualityEpic     = 36

# --- Protecting solo progression ---------------------------------------------
#
# Pricing alone does NOT keep raid gear out of reach, because the buyer bot
# prices with the same model: make an epic cost 13,000g and the bot will pay you
# ~13,000g for one you looted. One epic drop still buys one epic. Raising prices
# inflates the units without changing the exchange rate. These two keys are what
# actually gate it.

# Raids stay the only source of endgame loot. ilvl 200 is roughly Naxx-25 /
# early WotLK epics, so the AH remains a levelling, consumable and profession
# market without ever stocking current-tier raid gear.
AuctionHouseBot.ListedItemLevelRestrict.Enabled = true
AuctionHouseBot.ListedItemLevelRestrict.MaxItemLevel = 200

# The buyer pays 30% of list, creating a real spread. Selling roughly three
# items funds buying one, so the AH is a gold source without being a
# gear-laundering machine.
AuctionHouseBot.Buyer.AcceptablePriceModifier = 0.3
