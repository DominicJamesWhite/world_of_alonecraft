# Defender of the Faith 3/3 (T9.0) -- without them there is no Oath of
# Purification AoE, no Prophecy melee proc and no spell power on Shield of
# Righteousness, so the solo rotation has nothing to drive. Funded from
# Protection's 17 points: Divine Sacrifice and Divine Guardian only benefit a
# party, and Improved Righteous Fury needs a tanking buff a holy paladin never
# runs. Divinity 5/5 and Stoicism 3/3 stay; the spare point tops up Improved
# Concentration Aura, which is throughput now that Concentration Aura grants
# spell haste. 63 Holy / 8 Protection.
