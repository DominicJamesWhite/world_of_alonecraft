# ---------------------------------------------------------------------------
# Hunter pets: bears only
# ---------------------------------------------------------------------------
# PlayerbotFactory::InitPet (PlayerbotFactory.cpp:1344) picks a pet with
# urand(0, ids.size() - 1) over every tameable creature in the world, so a
# hunter's pet is a fresh roll on every gearing pass. Measured across four
# simulator runs the three hunter specs drew seven different families -- Spider,
# Bear, Boar, Raptor, Cat, Carrion Bird and Bird of Prey -- and those are not
# interchangeable: families differ in attack speed, damage, armour and their
# whole ability set, so consecutive runs of "the same" spec were not comparable
# and never had been.
#
# Bear (family 4) rather than any other single choice because a solo hunter's
# pet is a tank first: Tenacity has the highest armour and health of the three
# trees, and holding the target off a leather-wearing owner is worth more than
# the marginal damage of a Ferocity pet. hunter_mm survived Patchwerk taking one
# swing in three fights entirely on pet threat.
#
# ExcludedHunterPetFamilies is a blacklist, so "bears only" is spelled as every
# other tameable family. From CreatureFamily in SharedDefines.h:2642 -- 4 (bear)
# is the one absent. 10 is NOT_SPECIFIED and the warlock/DK families
# (15,16,17,19,23,29,40) are not tameable, so neither needs listing.
#
# SERVER-WIDE, not simulator-only: this is the same config the live random bots
# read, so every hunter bot in the world gets a bear too. That is intended --
# the simulator is supposed to measure the bots that actually play -- but it is
# worth knowing before wondering where the wolves went.
AiPlayerbot.ExcludedHunterPetFamilies = "1,2,3,5,6,7,8,9,11,12,20,21,24,25,26,27,30,31,32,33,34,35,37,38,39,41,42,43,44,45,46"
