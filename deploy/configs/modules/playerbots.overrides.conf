# Restoration druid: the premade build already carries Bloomstrike 3/3, Gift of
# Nature 5/5, Gift of the Earthmother 5/5, Nature's Focus 3/3, Living Spirit 3/3
# and Arakkoa Form -- but it leaves Spirit of the Storm at 0/5, so the solo
# rotation's Starfire gate could never open and Starfire was cast zero times in
# a 360-second measurement. This build buys it.
#
# Re-encoded from deploy/builds/druid_resto_solo.json, which is now the source.
# The link this replaces was INVALID and `bot_talents.py audit` failed it: it
# spent 3 points in Restoration tier 0, below the 5 that tiers 1 and 2 require,
# so Subtlety, Natural Shapeshifter, Intensity, Omen of Clarity and Master
# Shapeshifter were all silently dropped at learn time. Its comment claimed
# Improved Mark of the Wild 2/2 and the link did not buy it -- a talent moved in
# Restoration tier 0 after the link was authored and re-pointed every digit
# after it. Any measurement taken against the old line was measuring a different
# build from the one it described.
#
# PlayerbotFactory spends the link in (tier, col) order and checks each talent
# against the points already spent in that tab, so a build legal in total can
# still fail partway through. Restoration now runs 5 / 10 / 16 / 24 / 30 / 36 /
# 40 / 48 / 54 / 59 / 60 by the end of each tier against gates of 0 / 5 / 10 /
# 15 / 20 / 25 / 30 / 35 / 40 / 45 / 50. Balance likewise keeps exactly 10 in
# tiers 0-1, the minimum for Nature's Splendor. Subtlety is pure threat
# reduction and useless to a druid fighting alone; it survives at 2/3 purely as
# tier filler, and Revitalize gives up its third point to pay for Improved Mark
# of the Wild.
# 11 Balance / 60 Restoration.
#
# Empowered Touch stays at 1/2, and counter-intuitively that is the *stronger*
# setting, because PlayerbotFactory ends up applying the wrong rank.
#
# Proc diagnostics (Alonecraft.ProcDebug) show which aura the bot actually
# carries across a fight, and it is the opposite of the link in both cases: with
# the 1/2 link, rank 2 (33880, 100% chance) persists and rank 1 appears only in
# the buff burst at combat start; with a 2/2 link, rank 1 (33879, 50%) persists
# and rank 2 is the transient one. Measured, via Living Spores proc counts over
# 12 x 360s: 1/2 gives 682 ticks and 2827 DPS, 2/2 gives 437 and 2692.
#
# So this line reads 1 and buys the full-strength rank. That is a bug in the
# talent application, not something to encode permanently -- fix the factory and
# revisit, because 2/2 is what the build should want.
AiPlayerbot.WoaSoloSpecLink.11.2.80 = 05320001--230023312531501531053213051

