# ---------------------------------------------------------------------------
# Premade builds repaired against the current trees.
#
# `bot_talents.py audit` failed all 22 of these. Every one is the same class of
# fault as the block above -- a positional link outliving a tree edit -- but
# `migrate` could only re-author four of them, because the rest need a decision
# about where freed points go, and guessing that would silently invent a build.
# So each repair below is chosen to preserve the build's own intent, and each is
# validated at full budget with every tier gate satisfied.
#
# This matters beyond the grouped bots that run these builds: `sim_matrix --ab`
# reverts to the premade link for its baseline half, so a broken baseline makes
# every solo-spec delta flattering for a reason that has nothing to do with the
# rotation being measured.
#
# warrior arms pve   the 8-point Protection dip had landed entirely in tiers 1-2
#                    with tier 0 empty, after Shield Mastery lost a rank. Rebuilt
#                    as Toughness 5/5 + Anticipation 3/5. Incite, Improved
#                    Thunder Clap and Controlled Aggression all scale off block
#                    value, which a two-handed Arms warrior does not have.
# warrior fury pve   Riposte needs 5 points in Small Victories and the build had
#                    2. Folded Riposte's 2 points into Small Victories; buying
#                    the prerequisite outright would cost 3 points Fury has not
#                    got.
# warrior prot pve   Shield Mastery lost a rank and Controlled Aggression lost
#                    three, so the link overspent by 4. Both capped, the 4 into
#                    Toughness -- tier 0, so it lifts every gate below it.
# warrior arms pvp   same Riposte prerequisite, but Arms can afford it and
#                    Riposte is the keystone of the redesign, so Small Victories
#                    went to 5/5 out of Poleaxe Specialization instead.
# paladin holy pvp   Holy Guidance short of the 5 that tier 1 requires; topped up
#                    out of Anaphora, which sits above every gate it affects.
# rogue              one unspent point each, and one tier short. Spent in tier 0
#                    (Master of Deception) or tier 3 (Initiative) so it lifts the
#                    gate that was failing.
# dk unholy pve      one unspent point, tier 8 one short. Epidemic is the Unholy
#                    keystone -- shadow damage per disease -- and sits in tier 1.
# shaman resto pve   this is the "69 of 71 points" bug the solo-build comment
#                    above records. Two unspent points, tier 2 two short; Totemic
#                    Focus in tier 0 spends both and lifts every gate.
# warlock affli      re-authored by migrate. Fel Interdiction collapsed from 5
#                    ranks to 1, freeing a point that goes to Shadow Embrace.
# warlock destro pvp Molten Skin 5/5 became Infernal Bargain 1/1 and Emberstorm
#                    lost ranks, leaving the build 6 under budget and failing
#                    every gate from tier 2 down. Emberstorm back to 5/5 and
#                    Cataclysm to 2/3 spends all six in tier 1, where the deficit
#                    was.
