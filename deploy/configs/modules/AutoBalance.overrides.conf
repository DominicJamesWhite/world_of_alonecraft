# Alonecraft overrides for AutoBalance
#
# Generated 2026-08-05 from the values that were live in the deployed config.
# Only keys where Alonecraft deliberately differs from modules/mod-autobalance/conf/AutoBalance.conf.dist belong here --
# every other key comes from that template, so new upstream settings arrive
# automatically instead of silently falling back to compiled-in defaults.
#
# Apply with:  python tools/sync_configs.py --write --accept-changes
# Check drift: python tools/sync_configs.py

# Solo/small-group friendly difficulty curve.
#
# The multiplier is a tanh curve centred on `maxPlayers * InflectionPoint`
# (getDefaultMultiplier, mod-autobalance/src/ABUtils.cpp:616). Raising
# InflectionPoint pushes that midpoint to a higher player count, so enemies are
# weaker at 1-2 players while curveCeilingAdjustment still renormalises the top
# end to 1.0 at full group size -- only the low-player-count side moves.
#
# CurveFloor is an *additive* minimum, so it disproportionately raises the solo
# end in raids where the natural curve value at 1 player is only ~3%. Keep small.
#
# Solo enemy stats here: 5-man 17.2%, 10M 10.8%, 25M 8.4%, 40M 7.9%.
AutoBalance.InflectionPoint = 0.47
AutoBalance.InflectionPoint.CurveFloor = 0.03
AutoBalance.InflectionPointHeroic = 0.47
AutoBalance.InflectionPointHeroic.CurveFloor = 0.03
AutoBalance.InflectionPointRaid = 0.47
AutoBalance.InflectionPointRaid.CurveFloor = 0.03
AutoBalance.InflectionPointRaidHeroic = 0.47
AutoBalance.InflectionPointRaidHeroic.CurveFloor = 0.03
