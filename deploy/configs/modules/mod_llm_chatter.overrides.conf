# Alonecraft overrides for mod_llm_chatter
#
# Generated 2026-08-05 from the values that were live in the deployed config.
# Only keys where Alonecraft deliberately differs from modules/mod-llm-chatter/conf/mod_llm_chatter.conf.dist belong here --
# every other key comes from that template, so new upstream settings arrive
# automatically instead of silently falling back to compiled-in defaults.
#
# Apply with:  python tools/sync_configs.py --write --accept-changes
# Check drift: python tools/sync_configs.py

LLMChatter.RequestLog.Path = C:/Build/bin/RelWithDebInfo/logs/llm_requests.jsonl
LLMChatter.Database.Host = 127.0.0.1
LLMChatter.Database.User = acore
LLMChatter.TriggerChance = 0
LLMChatter.EventReactionChance = 0
LLMChatter.WeatherCooldownSeconds = 600
LLMChatter.WeatherAmbientCooldownSeconds = 300
LLMChatter.ProximityChatter.MaxTokensPerLine = 40
LLMChatter.GroupChatter.IdleCooldown = 30
LLMChatter.GroupChatter.StateCalloutChance = 60
LLMChatter.Bridge.InterSystemStaggerMin = 2
LLMChatter.Bridge.InterSystemStaggerMax = 4
LLMChatter.MessageDelayMin = 750
LLMChatter.MessageDelayMax = 18000
LLMChatter.BotSpeakerCooldownSeconds = 480

# Master switch for ALL General-channel chatter: ambient lines, world-event
# reactions, and bot replies to player messages in General.
#
# This replaced LLMChatter.GeneralChat.Enable, which upstream renamed in
# "feat: chat-type master toggles + owner_subsystem classifier". The old key had
# been set to 0 here and was doing nothing at all: the module reads its config
# with showLogs=false, so a key the C++ no longer looks up produces no warning
# and silently has no effect. General chatter had been running the whole time.
LLMChatter.GeneralChannel.Enable = 0

# Weather chatter, off. Two separate mechanisms, both needed:
#   Events.Weather              -- weather-change reactions and ambient
#                                  weather lines (C++ side).
#   Prompt.WeatherContextChance -- "Current weather: X" handed to the LLM as
#                                  ambient context on every group/guild/quest
#                                  prompt. Previously hardcoded at 50%, which
#                                  is why bots kept bringing up the weather
#                                  even with no weather event firing.
LLMChatter.Events.Weather = 0
LLMChatter.Prompt.WeatherContextChance = 0
