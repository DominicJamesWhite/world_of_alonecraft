# Alonecraft overrides for my_custom (world_of_alonecraft module)
#
# Only keys where the deployed value deliberately differs from
# modules/world_of_alonecraft/conf/my_custom.conf.dist belong here.
#
# Apply with:  python tools/sync_configs.py --write --accept-changes
# Check drift: python tools/sync_configs.py

# Re-enabled: the code that caused the logout crash no longer exists.
#
# The original gossip vendor swapped an equipped item with DestroyItem followed
# by EquipNewItem(swap=true) into the same slot.  That faulted inside
# Player::_SaveInventory on logout (PlayerStorage.cpp:7477) -- i.e. inside
# SaveToDB, making it a data-loss bug.  Nothing in core replaces an equipped
# item that way, and that whole file has been deleted.
#
# The replacement is item-targeted (ItemUpgradeTool.cpp): bag items take a plain
# destroy/store path, and equipped items use the unequip-to-bag sequence copied
# from Player::AutoUnequipOffhandIfNeed.  Untested as of writing -- if a logout
# crash reappears, set this to 0 and re-run sync_configs.py before playing on.
Alonecraft.ItemUpgrade.Enable = 1
