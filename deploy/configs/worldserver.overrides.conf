# Alonecraft overrides for worldserver
#
# Generated 2026-08-05 from the values that were live in the deployed config.
# Only keys where Alonecraft deliberately differs from src/server/apps/worldserver/worldserver.conf.dist belong here --
# every other key comes from that template, so new upstream settings arrive
# automatically instead of silently falling back to compiled-in defaults.
#
# Apply with:  python tools/sync_configs.py --write --accept-changes
# Check drift: python tools/sync_configs.py

DataDir = "C:\Build\bin\RelWithDebInfo\Data"
Updates.EnableDatabases = 6
# Appender::write drops a message when the appender's level < the message's
# level, so the template's Console at 4 swallows LOG_DEBUG (5). 5 is safe here:
# alonecraft* are the only loggers configured above 4, so nothing else gains
# console output.
Appender.Console = 1,5,0,"1 9 3 6 5 8"
Appender.Server = 2,5,7,Server.log,a
Appender.Playerbots = 2,5,7,Playerbots.log,a
Appender.Errors = 2,2,7,Errors.log,a
Logger.root = 3,Console Server
Logger.time.update = 3,Console Server
Logger.playerbots = 4,Playerbots
InstantFlightPaths = 2
AlwaysMaxSkillForLevel = 1
AlwaysMaxWeaponSkill = 1
StrictPlayerNames = 1
StrictPetNames = 1
CharactersPerAccount = 100
MinDualSpecLevel = 10
EnableLowLevelRegenBoost = 0
Rate.Damage.Fall = 0.75
NoResetTalentsCost = 1
DurabilityLossChance.Absorb = 0.0
Death.SicknessLevel = 81
Death.CorpseReclaimDelay.PvE = 0
CreatureFamilyFleeAssistanceRadius = 20
CreatureLeashRadius = 20
CreatureFamilyAssistanceDelay = 1000
CreatureFamilyAssistancePeriod = 4000
Instance.IgnoreRaid = 1
AccountInstancesPerHour = 50
StrictCharterNames = 1

# ICC's Strength of Wrynn / Hellscream's Warsong zone buff, off.  It is a nerf
# ramp built for guilds grinding a progression raid week after week; on a solo
# fork the encounters are already retuned, so stacking a further +30% health,
# healing and damage on top just makes the tuning meaningless.  0 disables the
# spell_area registration entirely (SpellMgr.cpp:2996).
ICC.Buff.Alliance = 0
ICC.Buff.Horde    = 0

# Experience.  Alonecraft is a solo/small-group fork, so a levelling curve tuned
# for a full group grinding together reads as a wall when one player is doing
# the same content alone.
#
# The 10x lives on quests and quests only.  An earlier version of this block put
# 10x on every source at once, and in play that reads as broken rather than
# generous: world mobs stop being content and become a formality, and a single
# stray pull can outweigh the quest you were on.  Quests are the channel that is
# actually paced -- they gate on travel, chains and turn-ins -- so they are the
# one that survives being multiplied.  Everything else is capped at 2x, enough
# to keep incidental kills feeling worth doing without becoming the fast route.
#
# Quest.DF is Dungeon Finder quest XP and tracks Quest.
#
# Rate.XP.Pet is 0 because hunter pets no longer level at all -- they are held
# at the owner's level by HunterPetLevelSync.cpp in this module, so pet XP has
# nothing left to do.
#
# Battleground kill rates below are left alone -- they are per-objective bonuses
# rather than a levelling channel, and scaling them turns PvP into the fastest
# way to level, which is not what this change is for.
Rate.XP.Kill      = 2
Rate.XP.Quest     = 10
Rate.XP.Quest.DF  = 10
Rate.XP.Explore   = 2
Rate.XP.Pet       = 0

# Retail gray band and quest level-difference slope, unmodified.
#
# This was briefly 1.5 as the companion to the across-the-board 10x: levelling
# 10x off every source outruns a zone's quest chains, so the band was widened to
# keep the zone's tail worth finishing.  With kills back at 2x that pressure is
# much weaker, and a widened band multiplies with the rate -- it would make
# farming trivial content an efficient route, the opposite of the intent.
#
# The supporting C++ (Acore::XP::GetXPGrayLevel / GetXPZeroDifference in
# Formulas.cpp) is a verified no-op at 1.0, so this setting is the whole
# rollback; see XPRangeTest in FormulasTest.cpp.
XP.LowLevelRangeMultiplier = 1.0

# The gold half of the 10x change.  A level is now worth about a tenth of the
# quests it used to be, so quest income per level fell by the same factor while
# every cost the game charges -- mounts, riding training, class trainers, the
# upgrade tools from Artificer Volen -- is still priced against the retail
# curve.  (Gear is handled separately, by the Quartermaster.)
#
# 8 rather than 10 on purpose.  Quest turn-ins are not the only income channel:
# kill and vendor money scale with time played rather than with levels gained,
# so they are untouched by the XP rate and still arrive at the normal pace.
# Compensating the quest channel at the full 10x over-corrects once the two are
# added together, and gold that arrives faster than it can be spent stops being
# a decision.  Rate.Drop.Money is deliberately left at 1: raising it would
# reward grinding rather than levelling, and it is the second lever if this
# still reads tight after a full 1-80 run.
#
# This key does NOT cover the level-80 money-instead-of-XP path -- that is
# Quest::GetRewMoneyMaxLevel (QuestDef.cpp:271-282), which multiplies by
# Rate.RewardBonusMoney.  A capped character's daily income is therefore
# unaffected, which is correct: they are no longer outrunning the content.
Rate.RewardQuestMoney = 8

# Cataclysm rage normalization.  Auto-attack rage is a function of weapon speed
# alone, so it no longer scales with gear: normalized rage per second is
# 3.5 * multiplier * (1 + crit) per weapon regardless of speed, level or item
# level.  The old formula's whole problem is that it pays out in proportion to
# damage, which means a character levelling in quest greens cannot afford their
# own rotation while a geared 80 is rage-capped -- and on a solo fork, the
# starved end of that curve is where most of the playtime is.
#
# The multiplier stays at the 1.5 default.  1.5 was picked to hold geared
# level-80 income flat (Arms 6.96 -> 7.09 rage/sec, Fury 9.40 -> 11.03) while
# nearly doubling it at levelling gear, so this is a buff where it hurts and a
# no-op where it does not.
Rage.Normalized = 1

# The risky half, and it does not stand alone.  Rage from damage taken is the
# majority of a tank's income at 80 (about 8.3 rage/sec against a boss), so
# removing it drops protection warriors from 11.9 to 6.0 rage/sec -- below the
# 7.7 they need for Shield Slam, Revenge and Thunder Clap alone, before a
# single Devastate.  Cataclysm got away with it because it simultaneously
# turned Shield Slam and Revenge into rage generators, and woa_2026_08_08_03.sql
# does the same here (Shield Slam +20, Revenge +15, Mangle (Bear) +15).
#
# Do not set this to 0 without that SQL applied.  Setting it back to 1 is the
# complete rollback for the tank half of the change; the ability generators are
# then simply a buff and can stay.
#
# Side effect worth knowing: Berserker Rage (18499) multiplies rage from damage
# taken by 3 and nothing else, so its rage function dies with this branch.  The
# SQL gives it back by spending its Sap immunity slot -- all three of its effect
# slots were mechanic immunities and nothing in Alonecraft saps you -- on a
# +100% rage-from-damage-dealt aura for the duration.  If this key is ever set
# back to 1, Berserker Rage then does both; that is a deliberate accepted
# overlap, not an oversight.
Rage.FromDamageTaken = 0

# Keys below are Alonecraft additions -- the core template does not define them,
# so sync_configs.py appends them rather than substituting in place.

# Temporary diagnostics category. Exists so debug logging has somewhere visible
# to go: the previous convention was to use LOG_ERROR because lower levels were
# filtered, and that is how ~21 debug LOG_ERROR calls ended up committed in
# MiscHandler.cpp and boss_razorscale.cpp. See the Logging section of CLAUDE.md.
Logger.alonecraft = 5,Console Server
# Must be 5 (LOG_LEVEL_DEBUG), not 4. Log::ShouldLog keeps a message only when
# the logger's level >= the message's level, and LOG_LEVEL_DEBUG is 5 while
# LOG_LEVEL_INFO is 4 -- at 4 every LOG_DEBUG("alonecraft.debug", ...) call was
# discarded before it reached an appender, which is exactly the silent-drop this
# category exists to avoid.
Logger.alonecraft.debug = 5,Console Server

# mod-autobalance, declared at 1 (FATAL) so it is effectively silent, and
# declared *at all* only so it can be raised for one run:
#
#     AC_LOGGER_MODULE_AUTO_BALANCE="5,Console" python tools/sim.py ...
#
# Log::LoadFromConfig discovers loggers by scanning config *files* for the
# "Logger." prefix. An AC_* environment variable can override the value of a key
# that exists, but it cannot conjure the key -- so a logger absent from every
# config is unreachable no matter what is exported, and mod-autobalance ships
# with no Logger line of its own.
#
# That mattered: the module rejects a map or creature for one of eight distinct
# reasons and writes a specific LOG_DEBUG for each, and none of them could be
# read while diagnosing why --autobalance changed nothing. Hours of guessing
# where the module was already saying the answer out loud.
Logger.module.AutoBalance = 1,Console
